<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>إجادة — دون اتصال</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --border: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      }
      .card {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 18px;
        min-height: 44px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>أنت دون اتصال حالياً</h1>
      <p>
        لا يمكن فتح هذه الصفحة الآن. إذا كنت معايناً أو مراجعاً حكومياً وكانت
        مهامك محمّلة مسبقاً، أعد المحاولة من الشاشة الرئيسية بعد عودة الاتصال
        أو من المسار المحفوظ في التطبيق.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
