name: Frontend checks

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck Microfrontends (MFEs)
        run: npm run typecheck:mfes

      - name: Run Frontend Unit Tests
        run: npm run test:unit
