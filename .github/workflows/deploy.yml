name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
    # Documentation cannot change a running system, and a full run costs 12 image builds.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "requirements/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Also run container tests and collect coverage"
        type: boolean
        default: false
  # Nightly full run, so the slow suite still guards main without sitting on every deploy.
  schedule:
    - cron: "0 2 * * *"

# Concurrency is set per job, not here. A workflow-level group either cancels a deploy
# halfway through the host, or makes every superseded build sit in the queue ahead of the
# one that matters — we hit the second when a documentation commit delayed a fix by 20
# minutes. Builds are disposable and get cancelled; deploys never are.

jobs:
  # ----------------------------------------------------
  # Job 1a: Frontend checks (PRs, nightly, and manual runs — never gate a deploy)
  # ----------------------------------------------------
  frontend:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      # Barrel-root MFE imports drag every view of a package into the importer's
      # chunk; the codebase reached zero and this keeps it there.
      - name: Guard MFE Barrel Imports
        run: npm run lint:barrel-imports

      - name: Typecheck Microfrontends (MFEs)
        run: npm run typecheck:mfes

      - name: Run Frontend Unit Tests
        run: npm run test:unit

      # tsc cannot see "use client" ordering or RSC boundary violations —
      # only a production build catches them (it found three latent breakers).
      - name: Build Shell (production)
        run: npm run build

  # ----------------------------------------------------
  # Job 1b: Backend build & tests (gates deploy on push to main)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Testcontainers (Postgres, RabbitMQ, Redis) dominates the run, so it is reserved
      # for the nightly schedule and for a manual run asking for the full suite.
      RUN_FULL_SUITE: ${{ github.event_name == 'schedule' || inputs.full_suite == true }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore Backend Dependencies
        run: dotnet restore backend/RealEstateEval.slnx

      - name: Build Backend
        run: dotnet build backend/RealEstateEval.slnx --configuration Release --no-restore

      # Deploy path: unit, application, and architecture tests only. The flag must be an
      # explicit "0" — left unset, the container tests probe for a Docker socket, and the
      # runner has one, so they would opt themselves back in.
      - name: Run Backend Tests
        if: env.RUN_FULL_SUITE != 'true'
        env:
          REAL_ESTATE_EVAL_CONTAINER_TESTS: "0"
        run: |
          dotnet test backend/RealEstateEval.slnx \
            --configuration Release --no-build --verbosity minimal

      # Testcontainers needs a Docker daemon; GitHub runners have one, so the Postgres,
      # RabbitMQ, and Redis smoke tests run for real here rather than skipping.
      - name: Run Backend Tests With Coverage
        if: env.RUN_FULL_SUITE == 'true'
        env:
          REAL_ESTATE_EVAL_CONTAINER_TESTS: "1"
        run: |
          dotnet test backend/RealEstateEval.slnx \
            --configuration Release --no-build --verbosity normal \
            --settings backend/coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/coverage

      - name: Summarize Coverage
        if: always() && env.RUN_FULL_SUITE == 'true'
        run: |
          set -eu
          shopt -s nullglob
          reports=(artifacts/coverage/*/coverage.cobertura.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::no coverage reports were produced"
            exit 1
          fi

          # The root <coverage> element carries the run totals.
          attribute() {
            sed -n "s/.*$2=\"\([^\"]*\)\".*/\1/p" "$1" | head -n 1
          }

          percent() {
            awk -v rate="$1" 'BEGIN { printf "%.2f%%", rate * 100 }'
          }

          {
            echo "### Backend coverage (EF migrations excluded)"
            echo
            echo "| Lines covered | Line rate | Branch rate |"
            echo "| --- | --- | --- |"
            for report in "${reports[@]}"; do
              covered=$(attribute "$report" lines-covered)
              valid=$(attribute "$report" lines-valid)
              echo "| ${covered}/${valid} | $(percent "$(attribute "$report" line-rate)") | $(percent "$(attribute "$report" branch-rate)") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Reports
        if: always() && env.RUN_FULL_SUITE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  # ----------------------------------------------------
  # Job 2: Build & Push Docker Images to GHCR
  # ----------------------------------------------------
  build-and-push:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    # A newer commit makes these images pointless; drop them and let the new run build.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.prep.outputs.image_owner }}
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          # Lowercase the owner name for docker registry compatibility
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_owner=$OWNER_LOWER" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_OWNER=$OWNER_LOWER" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push each microservice image
      - name: Build & Push Frontend (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/shell/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/gateway/RealEstateEval.Gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/gateway:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Identity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/identity/RealEstateEval.Identity.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/identity:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/identity:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Case Study Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/case-study/RealEstateEval.CaseStudy.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/case-study:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/case-study:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Operations Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/operations/RealEstateEval.Operations.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/operations:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/operations:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Reporting Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/reporting/RealEstateEval.Reporting.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/reporting:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/reporting:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Financial Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/financial/RealEstateEval.Financial.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/financial:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/financial:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Valuation Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/valuation/RealEstateEval.Valuation.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/valuation:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/valuation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Failures Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/failures/RealEstateEval.Failures.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/failures:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/failures:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Platform Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/platform/RealEstateEval.Platform.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/platform:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Attachments Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/attachments/RealEstateEval.Attachments.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/attachments:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/attachments:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push DbMigrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/tools/DbMigrate/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/db-migrate:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/db-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # Job 3: Deploy to Hetzner Cloud
  # ----------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Never interrupted, never concurrent: a second deploy waits for the host to settle.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The run's own token can pull the images it just pushed, so the host needs no
    # long-lived registry PAT. It expires with the job; whatever docker leaves in
    # ~/.docker/config.json afterwards is already dead.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deploy Directory on Hetzner VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          script: |
            mkdir -p /app/infra

      - name: Transfer Compose & Config Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          source: "infra/docker-compose.prod.yml,infra/nginx.conf,infra/otel-collector,infra/prometheus,infra/grafana,infra/fluent-bit"
          target: "/app"
          strip_components: 1

      - name: Deploy Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_OWNER: ${{ needs.build-and-push.outputs.image_owner }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
          TLS_CERTIFICATE_PATH: ${{ secrets.TLS_CERTIFICATE_PATH }}
          TLS_PRIVATE_KEY_PATH: ${{ secrets.TLS_PRIVATE_KEY_PATH }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          WEB_PUSH_ENABLED: ${{ secrets.WEB_PUSH_ENABLED }}
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_OWNER,IMAGE_TAG,TLS_CERTIFICATE_PATH,TLS_PRIVATE_KEY_PATH,PUBLIC_APP_URL,WEB_PUSH_ENABLED,WEB_PUSH_PUBLIC_KEY,WEB_PUSH_PRIVATE_KEY,WEB_PUSH_SUBJECT,JWT_SIGNING_KEY,POSTGRES_PASSWORD,RABBITMQ_USER,RABBITMQ_PASSWORD,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD
          script: |
            set -eu
            cd /app
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Host /app/.env is the documented source of compose secrets.
            # Parse KEY=VALUE only — never source the file (that would execute it).
            if [ -f .env ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  ''|\#*) continue ;;
                esac
                key="${line%%=*}"
                value="${line#*=}"
                case "$key" in
                  *[!A-Za-z0-9_]*|'') continue ;;
                esac
                export "$key=$value"
              done < .env
            fi

            apply_secret() {
              name="$1"
              value="$2"
              if [ -n "$value" ]; then
                export "$name=$value"
              fi
            }

            export IMAGE_OWNER="$IMAGE_OWNER"
            export TAG="$IMAGE_TAG"
            apply_secret TLS_CERTIFICATE_PATH "${TLS_CERTIFICATE_PATH:-}"
            apply_secret TLS_PRIVATE_KEY_PATH "${TLS_PRIVATE_KEY_PATH:-}"
            apply_secret PUBLIC_APP_URL "${PUBLIC_APP_URL:-}"
            apply_secret WEB_PUSH_ENABLED "${WEB_PUSH_ENABLED:-}"
            apply_secret WEB_PUSH_PUBLIC_KEY "${WEB_PUSH_PUBLIC_KEY:-}"
            apply_secret WEB_PUSH_PRIVATE_KEY "${WEB_PUSH_PRIVATE_KEY:-}"
            apply_secret WEB_PUSH_SUBJECT "${WEB_PUSH_SUBJECT:-}"
            apply_secret JWT_SIGNING_KEY "${JWT_SIGNING_KEY:-}"
            apply_secret POSTGRES_PASSWORD "${POSTGRES_PASSWORD:-}"
            apply_secret RABBITMQ_USER "${RABBITMQ_USER:-}"
            apply_secret RABBITMQ_PASSWORD "${RABBITMQ_PASSWORD:-}"
            apply_secret GRAFANA_ADMIN_USER "${GRAFANA_ADMIN_USER:-}"
            apply_secret GRAFANA_ADMIN_PASSWORD "${GRAFANA_ADMIN_PASSWORD:-}"

            # TLS is mandatory in Production. Fail before touching the running stack
            # when the host certificate has not been provisioned or renewed correctly.
            test -r "$TLS_CERTIFICATE_PATH"
            test -r "$TLS_PRIVATE_KEY_PATH"
            test -n "$PUBLIC_APP_URL"

            # Mandatory production secrets must be present and non-placeholder.
            required_secret() {
              name="$1"
              value="$2"
              if [ -z "${value:-}" ]; then
                echo "::error::$name is required for production deploy"
                exit 1
              fi
            }

            deny_value() {
              name="$1"
              value="$2"
              denied="$3"
              if [ "$value" = "$denied" ]; then
                echo "::error::$name must not use insecure default '$denied'"
                exit 1
              fi
            }

            required_secret "JWT_SIGNING_KEY" "${JWT_SIGNING_KEY:-}"
            required_secret "POSTGRES_PASSWORD" "${POSTGRES_PASSWORD:-}"
            required_secret "RABBITMQ_USER" "${RABBITMQ_USER:-}"
            required_secret "RABBITMQ_PASSWORD" "${RABBITMQ_PASSWORD:-}"
            required_secret "GRAFANA_ADMIN_USER" "${GRAFANA_ADMIN_USER:-}"
            required_secret "GRAFANA_ADMIN_PASSWORD" "${GRAFANA_ADMIN_PASSWORD:-}"

            if [ "${#JWT_SIGNING_KEY}" -lt 64 ]; then
              echo "::error::JWT_SIGNING_KEY must be at least 64 characters"
              exit 1
            fi
            case "$JWT_SIGNING_KEY" in
              *CHANGE_ME*|*DEV_ONLY*|*change_me*|*dev_only*)
                echo "::error::JWT_SIGNING_KEY contains a known placeholder token"
                exit 1
                ;;
            esac

            deny_value "RABBITMQ_USER" "$RABBITMQ_USER" "dev"
            deny_value "RABBITMQ_PASSWORD" "$RABBITMQ_PASSWORD" "dev"
            deny_value "POSTGRES_PASSWORD" "$POSTGRES_PASSWORD" "Admin"

            PREVIOUS_TAG=""
            if [ -f .deploy-tag ]; then
              PREVIOUS_TAG="$(cat .deploy-tag)"
            fi

            rollback_to_previous() {
              if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "$TAG" ]; then
                echo "No previous deploy tag recorded; manual rollback required"
                return 1
              fi
              echo "Rolling back to tag $PREVIOUS_TAG"
              export TAG="$PREVIOUS_TAG"
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            }

            # Persist Web Push VAPID into /app/.env so host restarts keep the same keys.
            # Compose also picks up the exported vars for this deploy run.
            if [ -n "${WEB_PUSH_PUBLIC_KEY:-}" ] && [ -n "${WEB_PUSH_PRIVATE_KEY:-}" ]; then
              touch .env
              grep -v '^WEB_PUSH_' .env > .env.webpush.tmp || true
              mv .env.webpush.tmp .env
              {
                echo "WEB_PUSH_ENABLED=${WEB_PUSH_ENABLED:-true}"
                echo "WEB_PUSH_PUBLIC_KEY=${WEB_PUSH_PUBLIC_KEY}"
                echo "WEB_PUSH_PRIVATE_KEY=${WEB_PUSH_PRIVATE_KEY}"
                echo "WEB_PUSH_SUBJECT=${WEB_PUSH_SUBJECT:-mailto:ops@ejada.local}"
              } >> .env
              chmod 600 .env
            fi

            # Pull images, apply EF migrations (one-shot), then bring the stack up.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Verify critical services from inside the Compose network.
            # wget exits non-zero for connection failures and non-2xx responses.
            check_endpoint() {
              name="$1"
              url="$2"
              attempts=12

              for attempt in $(seq 1 "$attempts"); do
                if docker compose -f docker-compose.prod.yml exec -T nginx \
                  wget --quiet --spider --timeout=5 "$url"; then
                  echo "$name passed"
                  return 0
                fi

                echo "$name not ready (attempt $attempt/$attempts)"
                sleep 5
              done

              echo "::error::$name failed after $attempts attempts"
              return 1
            }

            SMOKE_FAILED=0
            check_endpoint "Gateway health" "http://gateway:5160/health" || SMOKE_FAILED=1
            check_endpoint "Identity health" "http://identity:8080/health" || SMOKE_FAILED=1
            check_endpoint "Identity readiness" "http://identity:8080/ready" || SMOKE_FAILED=1
            check_endpoint "Case Study health" "http://case-study:8080/health" || SMOKE_FAILED=1
            check_endpoint "Case Study readiness" "http://case-study:8080/ready" || SMOKE_FAILED=1

            if ! curl --fail --silent --show-error --max-time 20 \
              "${PUBLIC_APP_URL%/}/" >/dev/null; then
              SMOKE_FAILED=1
            fi

            if [ "$SMOKE_FAILED" -ne 0 ]; then
              rollback_to_previous || true
              exit 1
            fi

            echo "$TAG" > .deploy-tag

            # Preserve SHA-tagged releases for rollback; remove dangling images only.
            docker image prune -f
