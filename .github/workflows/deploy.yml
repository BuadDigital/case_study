name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Run Tests
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck Microfrontends (MFEs)
        run: npm run typecheck:mfes

      - name: Run Frontend Unit Tests
        run: npm run test:unit

      - name: Restore Backend Dependencies
        run: dotnet restore backend/RealEstateEval.slnx

      - name: Build Backend
        run: dotnet build backend/RealEstateEval.slnx --configuration Release --no-restore

      # Testcontainers needs a Docker daemon; GitHub runners have one, so the Postgres,
      # RabbitMQ, and Redis smoke tests run for real here rather than skipping.
      - name: Run Backend Tests With Coverage
        env:
          REAL_ESTATE_EVAL_CONTAINER_TESTS: "1"
        run: |
          dotnet test backend/RealEstateEval.slnx \
            --configuration Release --no-build --verbosity normal \
            --settings backend/coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/coverage

      - name: Summarize Coverage
        if: always()
        run: |
          set -eu
          shopt -s nullglob
          reports=(artifacts/coverage/*/coverage.cobertura.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "::error::no coverage reports were produced"
            exit 1
          fi

          # The root <coverage> element carries the run totals.
          attribute() {
            sed -n "s/.*$2=\"\([^\"]*\)\".*/\1/p" "$1" | head -n 1
          }

          percent() {
            awk -v rate="$1" 'BEGIN { printf "%.2f%%", rate * 100 }'
          }

          {
            echo "### Backend coverage (EF migrations excluded)"
            echo
            echo "| Lines covered | Line rate | Branch rate |"
            echo "| --- | --- | --- |"
            for report in "${reports[@]}"; do
              covered=$(attribute "$report" lines-covered)
              valid=$(attribute "$report" lines-valid)
              echo "| ${covered}/${valid} | $(percent "$(attribute "$report" line-rate)") | $(percent "$(attribute "$report" branch-rate)") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  # ----------------------------------------------------
  # Job 2: Build & Push Docker Images to GHCR
  # ----------------------------------------------------
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_owner: ${{ steps.prep.outputs.image_owner }}
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Registry Variables
        id: prep
        run: |
          # Lowercase the owner name for docker registry compatibility
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_owner=$OWNER_LOWER" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "IMAGE_OWNER=$OWNER_LOWER" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push each microservice image
      - name: Build & Push Frontend (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/shell/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/frontend:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/gateway/RealEstateEval.Gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/gateway:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Identity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/identity/RealEstateEval.Identity.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/identity:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/identity:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Case Study Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/case-study/RealEstateEval.CaseStudy.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/case-study:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/case-study:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Operations Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/operations/RealEstateEval.Operations.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/operations:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/operations:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Reporting Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/reporting/RealEstateEval.Reporting.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/reporting:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/reporting:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Financial Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/financial/RealEstateEval.Financial.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/financial:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/financial:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Valuation Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/valuation/RealEstateEval.Valuation.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/valuation:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/valuation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Failures Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/failures/RealEstateEval.Failures.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/failures:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/failures:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Platform Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/platform/RealEstateEval.Platform.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/platform:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Attachments Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/attachments/RealEstateEval.Attachments.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/attachments:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/attachments:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push DbMigrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/tools/DbMigrate/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/db-migrate:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/case_study/db-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------
  # Job 3: Deploy to Hostinger VPS
  # ----------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Deploy Directory on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            mkdir -p /app/infra

      - name: Transfer Compose & Config Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "infra/docker-compose.prod.yml,infra/nginx.conf,infra/otel-collector,infra/prometheus,infra/grafana,infra/fluent-bit"
          target: "/app"
          strip_components: 1

      - name: Deploy Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -eu
            cd /app
            # Log into GHCR on VPS using user Personal Access Token (PAT)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export variables for compose
            export IMAGE_OWNER="${{ needs.build-and-push.outputs.image_owner }}"
            export TAG="${{ needs.build-and-push.outputs.tag }}"

            # Pull images, apply EF migrations (one-shot), then bring the stack up.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Verify critical services from inside the Compose network.
            # wget exits non-zero for connection failures and non-2xx responses.
            check_endpoint() {
              name="$1"
              url="$2"
              attempts=12

              for attempt in $(seq 1 "$attempts"); do
                if docker compose -f docker-compose.prod.yml exec -T nginx \
                  wget --quiet --spider --timeout=5 "$url"; then
                  echo "$name passed"
                  return 0
                fi

                echo "$name not ready (attempt $attempt/$attempts)"
                sleep 5
              done

              echo "::error::$name failed after $attempts attempts"
              return 1
            }

            check_endpoint "Gateway health" "http://gateway:5160/health"
            check_endpoint "Identity health" "http://identity:8080/health"
            check_endpoint "Identity readiness" "http://identity:8080/ready"
            check_endpoint "Case Study health" "http://case-study:8080/health"
            check_endpoint "Case Study readiness" "http://case-study:8080/ready"

            # Preserve SHA-tagged releases for rollback; remove dangling images only.
            docker image prune -f
