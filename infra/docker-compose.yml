# Local platform stack for Real Estate Evaluation (dev only).
# Usage: from repo root →  docker compose -f infra/docker-compose.yml up -d
# See docs/LOCAL_INFRA.md for URLs and credentials.

name: realestate-eval-infra

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 40s

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: ree-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin
      POSTGRES_DB: postgres
    ports:
      # Host 5433 avoids conflict with a local PostgreSQL install on 5432 (Windows).
      - "5433:5432"
    volumes:
      - ree_pgdata:/var/lib/postgresql/data
      - ./postgres/init-dev.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: ree-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    entrypoint: ["/bin/sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus; exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    container_name: ree-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ree-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # UI only on the host; OTLP intake is via otel-collector (4317/4318 below).
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: ree-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otelcol/config.yaml:ro
    # Host apps (npm run dev:api) export OTLP here; collector forwards traces to Jaeger.
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ree-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ree_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ree-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ree_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ree-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ree_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: ree-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: ree-fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Optional one-shot migrator (apps still migrate on startup in Development).
  migrate:
    build:
      context: ..
      dockerfile: backend/tools/DbMigrate/Dockerfile
    container_name: ree-migrate
    environment:
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_ATTACHMENTS: Host=postgres;Port=5432;Database=realestate_eval_attachments;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_IDENTITY: Host=postgres;Port=5432;Database=realestate_eval_identity;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_PLATFORM: Host=postgres;Port=5432;Database=realestate_eval_platform;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_VALUATION: Host=postgres;Port=5432;Database=realestate_eval_valuation;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FAILURES: Host=postgres;Port=5432;Database=realestate_eval_failures;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_OPERATIONS: Host=postgres;Port=5432;Database=realestate_eval_operations;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FINANCIAL: Host=postgres;Port=5432;Database=realestate_eval_financial;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_CASESTUDY: Host=postgres;Port=5432;Database=realestate_eval_case_study;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_messaging;Username=postgres;Password=Admin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["migrate"]

  identity:
    build:
      context: ..
      dockerfile: backend/services/identity/RealEstateEval.Identity.Api/Dockerfile
    container_name: ree-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_IDENTITY: Host=postgres;Port=5432;Database=realestate_eval_identity;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
      Auth__EnableDevLogin: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  case-study:
    build:
      context: ..
      dockerfile: backend/services/case-study/RealEstateEval.CaseStudy.Api/Dockerfile
    container_name: ree-case-study
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__SeedDemoData: "false"
      Database__MigrateOnStartup: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      UpstreamServices__ValuationBaseUrl: http://valuation:8080
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__FailuresBaseUrl: http://failures:8080
      UpstreamServices__OperationsBaseUrl: http://operations:8080
      UpstreamServices__FinancialBaseUrl: http://financial:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_IDENTITY: Host=postgres;Port=5432;Database=realestate_eval_identity;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_CASESTUDY: Host=postgres;Port=5432;Database=realestate_eval_case_study;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_messaging;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: dev
      RabbitMQ__Password: dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      attachments:
        condition: service_healthy
      platform:
        condition: service_healthy
      valuation:
        condition: service_healthy
      identity:
        condition: service_healthy
      failures:
        condition: service_healthy
      operations:
        condition: service_healthy
      financial:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  operations:
    build:
      context: ..
      dockerfile: backend/services/operations/RealEstateEval.Operations.Api/Dockerfile
    container_name: ree-operations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__FailuresBaseUrl: http://failures:8080
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      UpstreamServices__FinancialBaseUrl: http://financial:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_OPERATIONS: Host=postgres;Port=5432;Database=realestate_eval_operations;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_messaging;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
    depends_on:
      postgres:
        condition: service_healthy
      attachments:
        condition: service_healthy
      identity:
        condition: service_healthy
      failures:
        condition: service_healthy
      financial:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  reporting:
    build:
      context: ..
      dockerfile: backend/services/reporting/RealEstateEval.Reporting.Api/Dockerfile
    container_name: ree-reporting
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__GatewayBaseUrl: http://gateway:5160
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      UpstreamServices__ValuationBaseUrl: http://valuation:8080
      UpstreamServices__FailuresBaseUrl: http://failures:8080
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
    depends_on:
      case-study:
        condition: service_healthy
      valuation:
        condition: service_healthy
      failures:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  financial:
    build:
      context: ..
      dockerfile: backend/services/financial/RealEstateEval.Financial.Api/Dockerfile
    container_name: ree-financial
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__OperationsBaseUrl: http://operations:8080
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FINANCIAL: Host=postgres;Port=5432;Database=realestate_eval_financial;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      attachments:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  valuation:
    build:
      context: ..
      dockerfile: backend/services/valuation/RealEstateEval.Valuation.Api/Dockerfile
    container_name: ree-valuation
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_VALUATION: Host=postgres;Port=5432;Database=realestate_eval_valuation;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_CASESTUDY: Host=postgres;Port=5432;Database=realestate_eval_case_study;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: dev
      RabbitMQ__Password: dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      attachments:
        condition: service_healthy
      platform:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  failures:
    build:
      context: ..
      dockerfile: backend/services/failures/RealEstateEval.Failures.Api/Dockerfile
    container_name: ree-failures
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FAILURES: Host=postgres;Port=5432;Database=realestate_eval_failures;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_CASESTUDY: Host=postgres;Port=5432;Database=realestate_eval_case_study;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_messaging;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  platform:
    build:
      context: ..
      dockerfile: backend/services/platform/RealEstateEval.Platform.Api/Dockerfile
    container_name: ree-platform
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_PLATFORM: Host=postgres;Port=5432;Database=realestate_eval_platform;Username=postgres;Password=Admin
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_messaging;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  attachments:
    build:
      context: ..
      dockerfile: backend/services/attachments/RealEstateEval.Attachments.Api/Dockerfile
    container_name: ree-attachments
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Redis__ConnectionString: redis:6379
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_ATTACHMENTS: Host=postgres;Port=5432;Database=realestate_eval_attachments;Username=postgres;Password=Admin
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: CHANGE_ME_DEV_ONLY_USE_64_CHARS_MINIMUM_FOR_HMAC_SHA256_SIGNING_KEY_0123456789ABCDEF
    depends_on:
      postgres:
        condition: service_healthy
      platform:
        condition: service_healthy
      otel-collector:
        condition: service_started
    expose:
      - "8080"
    healthcheck: *app-healthcheck

  gateway:
    build:
      context: ..
      dockerfile: backend/gateway/RealEstateEval.Gateway/Dockerfile
    container_name: ree-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "5160:5160"
    depends_on:
      identity:
        condition: service_healthy
      case-study:
        condition: service_healthy
      operations:
        condition: service_healthy
      reporting:
        condition: service_healthy
      financial:
        condition: service_healthy
      valuation:
        condition: service_healthy
      failures:
        condition: service_healthy
      platform:
        condition: service_healthy
      attachments:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5160/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ree_pgdata:
  ree_prometheus_data:
  ree_grafana_data:
  ree_es_data:
