# Production stack for Real Estate Evaluation on Hetzner Cloud.
# Usage: IMAGE_OWNER=your-github-username TAG=<sha> docker compose -f docker-compose.prod.yml up -d
# Always run the migrate one-shot before (or via) deploy — apps never migrate in Production.

name: realestate-eval-prod

x-app-healthcheck: &app-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 40s

x-otel-env: &otel-env
  # Public TLS terminates at nginx. Trust the single private-network proxy hop so
  # ASP.NET sees the original HTTPS scheme and client address.
  # Observability stack removed from prod to save RAM; apps boot without OTEL collector.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

x-rabbit-env: &rabbit-env
  # One broker, one credential pair, on the private compose network. Handing it to every
  # application service keeps startup validation from turning into a per-service hunt:
  # several of them register outbox or notification options through shared infrastructure
  # helpers rather than in their own Program.cs.
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: 5672
  RabbitMQ__Enabled: "true"
  RabbitMQ__RequireEnabled: "true"
  RabbitMQ__UserName: ${RABBITMQ_USER:?Set RABBITMQ_USER}
  RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}

x-redis-env: &redis-env
  # Same reasoning as the broker: the default is localhost:6379, which inside a container
  # is the container itself. A service that caches without this silently fails every
  # lookup until its circuit breaker opens and the endpoint starts returning 500.
  Redis__ConnectionString: redis:6379

x-logging: &default-logging
  # Docker keeps container stdout forever by default: case-study alone wrote 260 MB in four
  # days (2026-09). Rotate at 10 MB x 3 files so each container is capped at ~30 MB on disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.5-alpine
    container_name: ree-prod-postgres
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ree_prod_pgdata:/var/lib/postgresql/data
      - ./postgres/init-prod.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: ree-prod-rabbitmq
    restart: always
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - ree_prod_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    container_name: ree-prod-redis
    restart: always
    logging: *default-logging
    volumes:
      - ree_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # HTML → PDF (Chromium) for valuation report `.pdf?k=…` links — internal only, no secrets.
  # The deny list blocks every http(s) fetch from rendered pages (SSRF guard); the report HTML
  # the valuation service posts is self-contained (images and fonts as data URLs).
  # The `file:` half is Gotenberg's own default, restated because an explicit --chromium-deny-list
  # REPLACES the default instead of extending it — dropping it would let posted HTML iframe
  # arbitrary container files into the PDF. Pin ≥8.32.0: that is where the route-scoped
  # AllowedFilePrefixes default-deny (GHSA-g924-cjx7-2rjw) landed as the second file:// guard.
  gotenberg:
    image: gotenberg/gotenberg:8.36.0
    container_name: ree-prod-gotenberg
    restart: always
    logging: *default-logging
    command:
      - "gotenberg"
      - '--chromium-deny-list=^(?:file:(?!//\/tmp/)|https?://).*'
      - "--api-timeout=120s"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Deploy-time schema migration (never run MigrateAsync inside Production apps).
  migrate:
    image: ghcr.io/${IMAGE_OWNER}/case_study/db-migrate:${TAG:-latest}
    container_name: ree-prod-migrate
    restart: "no"
    logging: *default-logging
    environment:
      # Deploys no longer re-seed the demo users (off since 2026-09-26). Users already in the
      # database stay. To run the DataSeeder once on purpose (demo users + its backfills):
      #   docker compose -f docker-compose.prod.yml run --rm migrate seed
      Database__SeedDemoData: "false"
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_ATTACHMENTS: Host=postgres;Port=5432;Database=realestate_eval_prod_attachments;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_IDENTITY: Host=postgres;Port=5432;Database=realestate_eval_prod_identity;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_PLATFORM: Host=postgres;Port=5432;Database=realestate_eval_prod_platform;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_VALUATION: Host=postgres;Port=5432;Database=realestate_eval_prod_valuation;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FAILURES: Host=postgres;Port=5432;Database=realestate_eval_prod_failures;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_OPERATIONS: Host=postgres;Port=5432;Database=realestate_eval_prod_operations;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FINANCIAL: Host=postgres;Port=5432;Database=realestate_eval_prod_financial;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_CASESTUDY: Host=postgres;Port=5432;Database=realestate_eval_prod_case_study;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_prod_messaging;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    image: ghcr.io/${IMAGE_OWNER}/case_study/identity:${TAG:-latest}
    container_name: ree-prod-identity
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "false"
      # Passwordless Saudi-mobile login (shell OTP UI → POST /api/auth/login).
      # Interim until real Saudi SMS OTP verify; keep true so number login works.
      Auth__EnableDevLogin: "true"
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_IDENTITY: Host=postgres;Port=5432;Database=realestate_eval_prod_identity;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  case-study:
    image: ghcr.io/${IMAGE_OWNER}/case_study/case-study:${TAG:-latest}
    container_name: ree-prod-case-study
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "false"
      Database__SeedDemoData: "false"
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      UpstreamServices__ValuationBaseUrl: http://valuation:8080
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__FailuresBaseUrl: http://failures:8080
      UpstreamServices__OperationsBaseUrl: http://operations:8080
      UpstreamServices__FinancialBaseUrl: http://financial:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_CASESTUDY: Host=postgres;Port=5432;Database=realestate_eval_prod_case_study;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_prod_messaging;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      attachments:
        condition: service_healthy
      platform:
        condition: service_healthy
      valuation:
        condition: service_healthy
      identity:
        condition: service_healthy
      failures:
        condition: service_healthy
      operations:
        condition: service_healthy
      financial:
        condition: service_healthy
    healthcheck: *app-healthcheck

  operations:
    image: ghcr.io/${IMAGE_OWNER}/case_study/operations:${TAG:-latest}
    container_name: ree-prod-operations
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__FailuresBaseUrl: http://failures:8080
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      UpstreamServices__FinancialBaseUrl: http://financial:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_OPERATIONS: Host=postgres;Port=5432;Database=realestate_eval_prod_operations;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_prod_messaging;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      attachments:
        condition: service_healthy
      identity:
        condition: service_healthy
      failures:
        condition: service_healthy
      financial:
        condition: service_healthy
    healthcheck: *app-healthcheck

  reporting:
    image: ghcr.io/${IMAGE_OWNER}/case_study/reporting:${TAG:-latest}
    container_name: ree-prod-reporting
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
      # Reporting aggregates by calling back through the gateway. The default is the
      # localhost port `npm run dev:api` uses, which resolves to the container itself.
      UpstreamServices__GatewayBaseUrl: http://gateway:5160
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  financial:
    image: ghcr.io/${IMAGE_OWNER}/case_study/financial:${TAG:-latest}
    container_name: ree-prod-financial
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__OperationsBaseUrl: http://operations:8080
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FINANCIAL: Host=postgres;Port=5432;Database=realestate_eval_prod_financial;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_prod_messaging;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      attachments:
        condition: service_healthy
    healthcheck: *app-healthcheck

  valuation:
    image: ghcr.io/${IMAGE_OWNER}/case_study/valuation:${TAG:-latest}
    container_name: ree-prod-valuation
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      UpstreamServices__AttachmentsBaseUrl: http://attachments:8080
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      # A9: Case Study reads via HTTP. Deliberately no depends_on case-study —
      # case-study already depends_on valuation; calls happen at request time.
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      # Report PDF links: HTML → PDF through the internal Gotenberg container.
      PdfRenderer__BaseUrl: http://gotenberg:3000
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_VALUATION: Host=postgres;Port=5432;Database=realestate_eval_prod_valuation;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      attachments:
        condition: service_healthy
      platform:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck: *app-healthcheck

  failures:
    image: ghcr.io/${IMAGE_OWNER}/case_study/failures:${TAG:-latest}
    container_name: ree-prod-failures
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      # Every failure action appends an audit row through Platform; without this the client
      # falls back to localhost:5168 and each resolve/approve/return/suspend answers 500 after
      # it has already been saved.
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      # A9: Case Study reads/side-effects via HTTP. Deliberately no depends_on case-study —
      # case-study already depends_on failures; calls happen at request time.
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_FAILURES: Host=postgres;Port=5432;Database=realestate_eval_prod_failures;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_prod_messaging;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *app-healthcheck

  platform:
    image: ghcr.io/${IMAGE_OWNER}/case_study/platform:${TAG:-latest}
    container_name: ree-prod-platform
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      UpstreamServices__IdentityBaseUrl: http://identity:8080
      UpstreamServices__CaseStudyBaseUrl: http://case-study:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_PLATFORM: Host=postgres;Port=5432;Database=realestate_eval_prod_platform;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_MESSAGING: Host=postgres;Port=5432;Database=realestate_eval_prod_messaging;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
      # Optional: leave WEB_PUSH_ENABLED=false (default) until VAPID keys are in /app/.env.
      WebPush__Enabled: ${WEB_PUSH_ENABLED:-false}
      WebPush__PublicKey: ${WEB_PUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEB_PUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${WEB_PUSH_SUBJECT:-mailto:ops@ejada.local}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck: *app-healthcheck

  attachments:
    image: ghcr.io/${IMAGE_OWNER}/case_study/attachments:${TAG:-latest}
    container_name: ree-prod-attachments
    restart: always
    logging: *default-logging
    environment:
      <<: [*otel-env, *rabbit-env, *redis-env]
      ASPNETCORE_ENVIRONMENT: Production
      UpstreamServices__PlatformBaseUrl: http://platform:8080
      REAL_ESTATE_EVAL_PG_CONNECTION_STRING_ATTACHMENTS: Host=postgres;Port=5432;Database=realestate_eval_prod_attachments;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Issuer: RealEstateEval
      Jwt__Audience: RealEstateEval
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Jwt__PreviousSigningKey: ${JWT_PREVIOUS_SIGNING_KEY:-}
      BlobStorage__LocalRootPath: /app/attachments-data
    volumes:
      - ree_prod_attachments_data:/app/attachments-data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      platform:
        condition: service_healthy
    healthcheck: *app-healthcheck

  gateway:
    image: ghcr.io/${IMAGE_OWNER}/case_study/gateway:${TAG:-latest}
    container_name: ree-prod-gateway
    restart: always
    logging: *default-logging
    environment:
      <<: *otel-env
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      identity:
        condition: service_healthy
      case-study:
        condition: service_healthy
      operations:
        condition: service_healthy
      reporting:
        condition: service_healthy
      financial:
        condition: service_healthy
      valuation:
        condition: service_healthy
      failures:
        condition: service_healthy
      platform:
        condition: service_healthy
      attachments:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5160/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/case_study/frontend:${TAG:-latest}
    container_name: ree-prod-frontend
    restart: always
    logging: *default-logging
    environment:
      NODE_ENV: production
      API_UPSTREAM_URL: http://gateway:5160
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27.4-alpine
    container_name: ree-prod-nginx
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # These must be real files, never the symlinks under letsencrypt/live: a bind mount
      # resolves its source once, when the container is created, so a renewed certificate
      # would sit on disk while nginx kept serving the expired one it first opened. The
      # renewal hook copies into these paths in place and reloads nginx.
      - ${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Set TLS_PRIVATE_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
      - ${ACME_WEBROOT:-/app/acme}:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  ree_prod_pgdata:
  ree_prod_rabbitmqdata:
  ree_prod_redisdata:
  ree_prod_attachments_data:
