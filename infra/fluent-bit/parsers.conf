[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# The services log structured JSON, so the payload inside Docker's "log" field is
# itself a document. Parsing it here is what puts EventId, Category, and friends in
# Elasticsearch as fields rather than one opaque string.
[PARSER]
    Name        service_json
    Format      json
