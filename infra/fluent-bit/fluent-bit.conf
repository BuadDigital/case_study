[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Docker json-file logs (compose mounts /var/lib/docker/containers).
[INPUT]
    Name                tail
    Tag                 docker.*
    Path                /var/lib/docker/containers/*/*.log
    Parser              docker
    DB                  /tmp/flb_docker.db
    Mem_Buf_Limit       10MB
    Skip_Long_Lines     On
    Refresh_Interval    5

# The kubernetes filter belongs to a cluster: it calls the Kubernetes API for pod
# metadata, and it rejected this configuration outright on a plain Docker host. The
# only thing wanted here was merging the JSON payload, which the parser filter does.
[FILTER]
    Name                parser
    Match               docker.*
    Key_Name            log
    Parser              service_json
    Reserve_Data        On

[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     fluentbit
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5
