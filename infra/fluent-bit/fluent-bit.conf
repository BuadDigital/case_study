[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Docker json-file logs (compose mounts /var/lib/docker/containers).
[INPUT]
    Name                tail
    Tag                 docker.*
    Path                /var/lib/docker/containers/*/*.log
    Parser              docker
    DB                  /tmp/flb_docker.db
    Mem_Buf_Limit       10MB
    Skip_Long_Lines     On
    Refresh_Interval    5

[FILTER]
    Name                kubernetes
    Match               docker.*
    Merge_Log           On
    Keep_Log            Off
    Reserved_Log_Field_Prefix _

[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     fluentbit
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         5
