global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # App metrics arrive via OTLP → otel-collector (services do not expose /metrics).
  # Labels include service.name for identity, case-study, operations, reporting,
  # financial, valuation, failures, platform, attachments, and gateway.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
